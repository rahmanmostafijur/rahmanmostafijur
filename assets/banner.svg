<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Mostafijur Rahman - Full Stack Engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0d1117"/>
<stop offset="48%" stop-color="#0077b6"/>
<stop offset="100%" stop-color="#00d4aa"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/>
<stop offset="50%" stop-color="#fff" stop-opacity="0.09"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="cp"><rect width="1000" height="250" rx="12"/></clipPath>
</defs>
<style>
.n{font:700 46px "Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff;opacity:0;animation:rise .9s cubic-bezier(.2,.7,.3,1) .15s forwards}
.s{font:500 16px "Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#dffaf3;opacity:0;animation:rise .9s cubic-bezier(.2,.7,.3,1) .5s forwards;letter-spacing:.6px}
.cur{fill:#00ffcc;animation:blink 1.1s steps(1) infinite}
.chip{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards}
.chip rect{fill:rgba(255,255,255,.13);stroke:rgba(255,255,255,.30);stroke-width:1}
.chip text{font:600 13px "Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:.5px}
.c1{animation-delay:.85s}.c2{animation-delay:.95s}.c3{animation-delay:1.05s}.c4{animation-delay:1.15s}.c5{animation-delay:1.25s}.c6{animation-delay:1.35s}
.fl{animation:float 4.2s ease-in-out infinite}
.f2{animation-delay:.3s}.f3{animation-delay:.6s}.f4{animation-delay:.9s}.f5{animation-delay:1.2s}.f6{animation-delay:1.5s}
.sw{animation:sweep 7s linear infinite}
.tw{animation:twinkle 3.4s ease-in-out infinite}
.t2{animation-delay:.7s}.t3{animation-delay:1.4s}.t4{animation-delay:2.1s}.t5{animation-delay:2.8s}
.gl{stroke:#fff;stroke-opacity:.07;stroke-width:1}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sweep{from{transform:translateX(-340px)}to{transform:translateX(1040px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.55}}
</style>
<g clip-path="url(#cp)">
<rect width="1000" height="250" fill="url(#bg)"/>
<g class="gl">
<path d="M0 62h1000M0 125h1000M0 188h1000"/>
<path d="M200 0v250M400 0v250M600 0v250M800 0v250"/>
</g>
<g fill="#fff">
<circle class="tw" cx="90" cy="48" r="2.5"/>
<circle class="tw t2" cx="915" cy="70" r="3"/>
<circle class="tw t3" cx="150" cy="200" r="2"/>
<circle class="tw t4" cx="860" cy="196" r="2.5"/>
<circle class="tw t5" cx="500" cy="32" r="2"/>
</g>
<rect class="sw" x="0" y="0" width="320" height="250" fill="url(#sheen)"/>
<text class="n" x="500" y="96" text-anchor="middle">Mostafijur Rahman</text>
<text class="s" x="500" y="128" text-anchor="middle">Full Stack Engineer &#183; Dhaka, Bangladesh</text>
<rect class="cur" x="792" y="114" width="9" height="18"/>
<g class="chip c1"><g class="fl"><rect x="202" y="166" width="84" height="30" rx="15"/><text x="244" y="186" text-anchor="middle">Python</text></g></g>
<g class="chip c2"><g class="fl f2"><rect x="296" y="166" width="88" height="30" rx="15"/><text x="340" y="186" text-anchor="middle">FastAPI</text></g></g>
<g class="chip c3"><g class="fl f3"><rect x="394" y="166" width="112" height="30" rx="15"/><text x="450" y="186" text-anchor="middle">PostgreSQL</text></g></g>
<g class="chip c4"><g class="fl f4"><rect x="516" y="166" width="78" height="30" rx="15"/><text x="555" y="186" text-anchor="middle">React</text></g></g>
<g class="chip c5"><g class="fl f5"><rect x="604" y="166" width="100" height="30" rx="15"/><text x="654" y="186" text-anchor="middle">TypeScript</text></g></g>
<g class="chip c6"><g class="fl f6"><rect x="714" y="166" width="84" height="30" rx="15"/><text x="756" y="186" text-anchor="middle">Docker</text></g></g>
</g>
</svg>
